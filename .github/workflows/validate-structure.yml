name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-docs-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check for ERD image (PNG or PDF)
        run: |
          if ! ls docs/*.png docs/*.PNG docs/*.pdf docs/*.PDF 1> /dev/null 2>&1; then
            echo "ERROR: No ERD image (.png or .pdf) found in /docs."
            exit 1
          fi
          echo "ERD image found."

      - name: Check for endpoint plan document
        run: |
          if ! ls docs/*.md docs/*.pdf docs/*.MD docs/*.PDF 1> /dev/null 2>&1; then
            echo "ERROR: No endpoint plan document (.md or .pdf) found in /docs."
            exit 1
          fi
          echo "Endpoint plan document found."

      - name: Check for SQL script
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "ERROR: No SQL script (.sql) found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: All required files present
        run: echo "Repository structure validated successfully."
